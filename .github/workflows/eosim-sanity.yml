name: EoSim Sanity
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eosim-validation:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-13]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install EoSim from source (pinned)
        env:
          # v0.1.0 has never existed. embeddedos-org/EoSim tags v0.2.0-book and
          # v1.0.0 through v3.0.1; v1.5.0 is the release marked Latest.
          EOSIM_VERSION: "1.5.0"
        shell: bash
        run: |
          set -e
          # runner.temp, not /tmp: this matrix includes windows-2022, where the
          # step runs under Git Bash but pip is a native Windows interpreter and
          # cannot resolve a "/tmp/..." path.
          git clone --depth 1 --branch v${EOSIM_VERSION} https://github.com/embeddedos-org/EoSim.git "${{ runner.temp }}/eosim"
          pip install -e "${{ runner.temp }}/eosim"

      - name: Validate EoSim installation
        shell: bash
        run: |
          set -e
          OUT=$(eosim --version 2>&1)
          echo "eosim --version: $OUT"
          if ! echo "$OUT" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::eosim --version did not return a semantic version"
            exit 1
          fi
